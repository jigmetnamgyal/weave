openapi: 3.1.0

info:
  title: Weave Control Plane API
  version: 0.1.0
  description: |
    The Weave control-plane HTTP API.

    This document is the source of truth for the API surface and is updated
    before or alongside the implementation it describes. The TypeScript client
    is generated from it; response types are never hand-written in the web
    application.

    Only the authenticated user's own profile is defined so far. Workspaces,
    tasks and sessions arrive in later units.

    Operational probes (`/health/live`, `/health/ready`) are deliberately not
    described here: they are an operator interface, not part of the versioned
    product API, and their shape is free to change with the deployment.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: users
    description: The authenticated user.
  - name: invitations
    description: |
  - name: github
    description: GitHub App installations and the repositories they grant.
  - name: tasks
    description: Units of work a session is created from.
  - name: agents
    description: Versioned agent profiles and declared provider capabilities.
      Accepting an invitation is the one workspace operation available to
      someone who is not yet a member, so these routes sit outside the
      workspace path and are authorized by the token rather than by
      membership.
  - name: workspaces
    description: |
      Workspaces are the tenant boundary. Authorization has two steps and the
      responses distinguish them: a caller who is not a member receives `404`
      for every workspace endpoint, identical to a workspace that does not
      exist, because `403` would confirm existence and allow tenant
      enumeration. A member who lacks the required permission receives `403`.

security:
  - bearerAuth: []

paths:
  /v1/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Return the authenticated user
      description: |
        Resolves the presented session token to the caller's Weave user.

        On first sign-in the user record is created, so a client never has to
        register a user before calling this.

        The response carries the internal user identifier only. The identity
        provider's subject is never exposed: it is an implementation detail of
        how someone signed in, and clients must not key on it.
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: List the caller's workspaces
      responses:
        "200":
          description: Workspaces the caller belongs to, each with their role.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Create a workspace
      description: The caller becomes its owner. A workspace always has at least one owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "201":
          description: The created workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /v1/workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getWorkspace
      tags: [workspaces]
      summary: Return one workspace
      responses:
        "200":
          description: The workspace, with the caller's role and permissions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
    patch:
      operationId: renameWorkspace
      tags: [workspaces]
      summary: Rename a workspace
      description: |
        Requires `workspace:manage`.

        `version` is mandatory and must be the value from the last read. A
        stale version returns `409` rather than overwriting a concurrent edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, version]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                version: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The updated workspace, carrying its new version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/workspaces/{workspaceId}/invitations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listWorkspaceInvitations
      tags: [workspaces]
      summary: List a workspace's invitations
      description: |
        Requires `member:invite`. Never returns tokens or token hashes.

        Omitting `status` returns every invitation. An unrecognised value is
        rejected rather than ignored, so a caller never receives the full list
        under a filter it believes was applied.
      parameters:
        - name: status
          in: query
          required: false
          description: Narrow the list to one status.
          schema:
            type: string
            enum: [pending, accepted, revoked, expired]
      responses:
        "200":
          description: Every invitation for the workspace, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
    post:
      operationId: issueWorkspaceInvitation
      tags: [workspaces]
      summary: Invite someone to the workspace
      description: |
        Requires `member:invite`, and the inviter must be able to grant the
        role — an admin cannot invite an owner, for the same reason an admin
        cannot promote one.

        **The response carries the token, and it is the only time it ever
        exists outside the recipient's link.** Only its hash is stored, so it
        cannot be retrieved afterwards. Surface it immediately or it is lost.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: The invitation, together with its token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedInvitation" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
        "409":
          description: The address already belongs to the workspace, or already has an outstanding invitation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/workspaces/{workspaceId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeWorkspaceInvitation
      tags: [workspaces]
      summary: Withdraw an invitation
      description: Requires `member:invite`. Only an outstanding invitation can be revoked.
      responses:
        "204": { description: The invitation was withdrawn. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }

  /v1/invitations/preview:
    post:
      operationId: previewInvitation
      tags: [invitations]
      summary: Describe an invitation to its holder
      description: |
        Lets someone see what they are being asked to join before accepting.

        `POST` rather than `GET` because the token travels in the body: a
        token in a query string ends up in server logs, proxy logs and
        `Referer` headers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationTokenRequest" }
      responses:
        "200":
          description: What the invitation offers, and nothing else about the workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreview" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/InvitationNotUsable" }

  /v1/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [invitations]
      summary: Accept an invitation
      description: |
        Requires authentication, but not membership — the caller is not a
        member yet, and the token is what authorizes them.

        The signed-in account's email must match the invited address. A link
        that admits whoever opens it would turn a forwarded message into a
        workspace breach.

        The token is single use: concurrent accepts of one token produce
        exactly one membership.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationTokenRequest" }
      responses:
        "200":
          description: The membership created by accepting.
          content:
            application/json:
              schema:
                type: object
                required: [workspace_id, role]
                properties:
                  workspace_id: { type: string, format: uuid }
                  role: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: The invitation was issued to a different email address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/InvitationNotUsable" }
        "409":
          description: The caller already belongs to this workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/workspaces/{workspaceId}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listWorkspaceMembers
      tags: [workspaces]
      summary: List a workspace's members
      responses:
        "200":
          description: Every member of the workspace.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }

  /v1/workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: changeWorkspaceMemberRole
      tags: [workspaces]
      summary: Change a member's role
      description: |
        Requires `member:manage`. Demoting the last owner returns `409`: a
        workspace with no owner cannot be administered by anyone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: The updated membership.
          content:
            application/json:
              schema:
                type: object
                required: [user_id, role]
                properties:
                  user_id: { type: string, format: uuid }
                  role: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: removeWorkspaceMember
      tags: [workspaces]
      summary: Remove a member
      description: |
        Requires `member:manage`, except when removing yourself, which any
        member may do. Removing the last owner returns `409`.
      responses:
        "204": { description: The member was removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/workspaces/{workspaceId}/github/install:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: beginGitHubInstall
      tags: [github]
      summary: Start connecting a GitHub account to this workspace
      description: |
        Returns the URL to send the browser to. The server records which
        workspace the resulting installation belongs to before answering,
        keyed by a single-use value carried in that URL.

        That recording is the whole mechanism: GitHub returns an installation
        id and nothing identifying the workspace, so the workspace must not be
        taken from the callback.
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                type: object
                required: [install_url]
                properties:
                  install_url: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }

  /v1/github/installations:
    post:
      operationId: completeGitHubInstall
      tags: [github]
      summary: Finish connecting a GitHub account
      description: |
        Authenticated but not workspace-scoped: the workspace comes from the
        state recorded before the redirect, never from the request.

        The same endpoint serves a repository-access change, because GitHub
        sends the browser back through it with the installation id it already
        has. A collision whose workspace matches the recorded state is an
        update and reconciles; one that differs is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, installation_id]
              properties:
                state:
                  type: string
                  description: The single-use value GitHub echoed back.
                installation_id:
                  type: integer
                  format: int64
                  description: |
                    A claim, not a fact. It is confirmed with GitHub before
                    anything is written.
      responses:
        "201":
          description: The installation is bound to the workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Installation" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409":
          description: |
            The installation is already connected to a different workspace.
            Refused rather than rebound, because rebinding would move a
            repository grant between tenants.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/workspaces/{workspaceId}/github/installations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listGitHubInstallations
      tags: [github]
      summary: List the GitHub accounts connected to this workspace
      description: |
        Removed installations are excluded. Their repository rows survive for
        audit, but the connection is gone.
      responses:
        "200":
          description: The connected accounts.
          content:
            application/json:
              schema:
                type: object
                required: [installations]
                properties:
                  installations:
                    type: array
                    items: { $ref: "#/components/schemas/Installation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }

  /v1/workspaces/{workspaceId}/github/installations/{installationId}/health:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/InstallationId"
    get:
      operationId: getGitHubInstallationHealth
      tags: [github]
      summary: Report whether an installation can still do its job
      description: |
        Reports rather than fails. Someone debugging a broken workspace needs
        to know which of several things is wrong, and an error response would
        collapse them into one.

        When GitHub is unreachable this falls back to the permissions recorded
        at the last reconciliation, and says so through `reachable`.
      responses:
        "200":
          description: The installation's current state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallationHealth" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }

  /v1/workspaces/{workspaceId}/github/installations/{installationId}/reconcile:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/InstallationId"
    post:
      operationId: reconcileGitHubInstallation
      tags: [github]
      summary: Replace the recorded repository set with what GitHub grants now
      responses:
        "204":
          description: The recorded set now matches GitHub.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }

  /v1/workspaces/{workspaceId}/repositories:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listWorkspaceRepositories
      tags: [github]
      summary: List the repositories connected to this workspace
      description: |
        Withdrawn repositories are included with `granted: false`, so the
        interface can say access was removed rather than silently dropping
        something a member used yesterday. Repositories belonging to a removed
        installation are excluded: their rows are kept for audit, but they are
        no longer current state.
      responses:
        "200":
          description: The workspace's repositories.
          content:
            application/json:
              schema:
                type: object
                required: [repositories]
                properties:
                  repositories:
                    type: array
                    items: { $ref: "#/components/schemas/Repository" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }

  /v1/workspaces/{workspaceId}/repositories/{repositoryId}/branches:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: repositoryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: createBranch
      tags: [github]
      summary: Create a branch in a connected repository
      description: |
        The first external side effect Weave performs on a customer's
        repository.

        Access is re-checked against GitHub before writing, not against our
        records: a grant withdrawn since the page loaded stops the write here.
        A protected target is refused outright — protected branches never
        receive direct agent writes — though creating a branch *from* a
        protected base is normal.

        Idempotent by name. A request repeating one that succeeded returns the
        same branch with `200` and `created: false`, rather than failing on
        GitHub's duplicate-ref refusal. A branch of that name pointing
        somewhere other than the requested base is a conflict, not a success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: |
                    Required, and must begin with `weave/`. A caller that may
                    retry needs the same request to name the same branch —
                    generating one here would make each attempt create
                    another, which is the opposite of the idempotency below.
                base:
                  type: string
                  description: The branch to create from. Defaults to the repository's default branch.
      responses:
        "201":
          description: The branch was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "200":
          description: |
            The branch already existed at the requested base. The same body,
            with `created: false` — a retry finding its own earlier work.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: |
            The caller's role cannot manage repositories, the installation no
            longer grants the repository, the installation is suspended, the
            installation does not hold `contents: write`, or the target branch
            is protected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            The workspace is not the caller's or does not exist, the repository
            was not found in it, or the requested base branch does not exist in
            the repository. The three are deliberately indistinguishable for
            the first two — a response confirming a workspace exists but is not
            yours turns identifier guessing into tenant enumeration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            A branch of that name exists and points somewhere other than the
            requested base. Refused rather than returned, because handing back
            a branch at unknown work as though it were what was asked for is
            worse than an error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/workspaces/{workspaceId}/tasks:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      description: |
        A task is the input to a session, so `session:create` governs it:
        anyone who may start a session must be able to describe the work, and
        anyone who may not has no use for a task.

        The body is untrusted input. It is stored and returned byte-identical,
        never interpolated into a command, a prompt template, a ref name or a
        log format string, and never normalised on the way out — the stored
        value and the returned value must agree, or nobody can tell what is
        actually stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "201":
          description: The task was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List a workspace's tasks, newest first
      responses:
        "200":
          description: The workspace's tasks.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }

  /v1/workspaces/{workspaceId}/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: getTask
      tags: [tasks]
      summary: Return one task
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: |
            The workspace is not the caller's or does not exist, or no task of
            that id is in it. Deliberately indistinguishable: a response
            confirming a workspace exists but is not yours turns identifier
            guessing into tenant enumeration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Change some of a task's editable fields
      description: |
        A partial update: a field that is omitted is left as it is. Sending
        `repository_id` as `null` clears it, and omitting it leaves it alone.

        Clearing it does not change the status. A ready task must name a
        repository, so clearing one without also sending `status: draft` is
        refused — moving a ready task back to a draft naming nothing means
        sending both.

        `repository_id` is the only field that accepts `null`; a `null` in any
        other is refused rather than read as an omission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskPatch" }
      responses:
        "200":
          description: The updated task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404":
          description: The workspace or the task was not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/workspaces/{workspaceId}/agents:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create an agent profile and its first version
      description: |
        Governed by `workspace:manage` rather than `session:create`, because a
        version carries the tool policy — what an agent is allowed to do inside
        a customer's repository. A developer may run agents and not redefine
        what they may do.

        The profile and its first version are written together. An agent with
        no version is a profile that cannot be used and that nothing would
        notice until a session failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [name]
                  properties:
                    name: { type: string, maxLength: 80 }
                - $ref: "#/components/schemas/AgentVersionInput"
      responses:
        "201":
          description: The profile and the version it starts at.
          content:
            application/json:
              schema:
                type: object
                required: [agent, version]
                properties:
                  agent: { $ref: "#/components/schemas/Agent" }
                  version: { $ref: "#/components/schemas/AgentVersion" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }
        "409":
          description: An agent of that name already exists in the workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      operationId: listAgents
      tags: [agents]
      summary: List a workspace's agent profiles
      responses:
        "200":
          description: The workspace's agents.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }

  /v1/workspaces/{workspaceId}/agents/{agentId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: getAgent
      tags: [agents]
      summary: Return one agent profile
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: The workspace or the agent was not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/workspaces/{workspaceId}/agents/{agentId}/versions:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: addAgentVersion
      tags: [agents]
      summary: Record new settings for an agent
      description: |
        This is what editing a profile means. The previous version is untouched
        and cannot be modified — the table refuses it — because a session is
        pinned to the version it ran under, and editing one would rewrite what
        finished sessions claim to have done.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentVersionInput" }
      responses:
        "201":
          description: The new version, which the agent now points at.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentVersion" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404":
          description: The workspace or the agent was not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      operationId: listAgentVersions
      tags: [agents]
      summary: List an agent's versions, newest first
      responses:
        "200":
          description: Every version recorded for the agent.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AgentVersion" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: The workspace or the agent was not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/workspaces/{workspaceId}/sessions:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Start a session from a ready task
      description: |
        Writes the session, its first participant, its first state transition,
        and the durable record that something will pick it up — all in one
        transaction. A session that exists without that record is a session
        nothing would ever start, and no retry would fix it.

        Nothing runs yet, and no branch is created. `branch_name` on the
        response is the branch the workflow **will** create; it does not exist
        when this returns.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionInput" }
      responses:
        "201":
          description: The queued session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404":
          description: The workspace, the task, or the agent version was not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            The task is not ready. Nothing about the request is malformed — the
            task is in a state a session cannot be created from, and it is the
            task that changes rather than the request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List a workspace's sessions, newest first
      responses:
        "200":
          description: Every session in the workspace.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/WorkspaceNotFound" }

  /v1/workspaces/{workspaceId}/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSession
      tags: [sessions]
      summary: Read one session
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: |
            The workspace or the session was not found. A session belonging to
            another workspace is absent rather than forbidden, so that guessing
            identifiers cannot become tenant enumeration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/workspaces/{workspaceId}/sessions/{sessionId}/transitions:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listSessionTransitions
      tags: [sessions]
      summary: List a session's state history, oldest first
      description: |
        Append-only. Invariant 9 makes session history append-only and ordered,
        so a correction is a new transition rather than an edit to an old one —
        the database refuses UPDATE, DELETE and TRUNCATE on this table.
      responses:
        "200":
          description: Every transition the session has made.
          content:
            application/json:
              schema:
                type: object
                required: [transitions]
                properties:
                  transitions:
                    type: array
                    items: { $ref: "#/components/schemas/SessionTransition" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: The workspace or the session was not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/workspaces/{workspaceId}/sessions/{sessionId}/participants:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listSessionParticipants
      tags: [sessions]
      summary: List who is in a session
      responses:
        "200":
          description: Every participant in the session.
          content:
            application/json:
              schema:
                type: object
                required: [participants]
                properties:
                  participants:
                    type: array
                    items: { $ref: "#/components/schemas/SessionParticipant" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: The workspace or the session was not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/github/webhook:
    post:
      operationId: receiveGitHubWebhook
      tags: [github]
      summary: Receive a delivery from GitHub
      description: |
        Public: GitHub cannot present a session token, so the HMAC signature
        over the raw body is the authentication. It is verified before the
        payload is parsed.

        Rejections carry no body. The sender has no interface to show an error
        in, and explaining why a forgery failed only helps the next one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A GitHub webhook payload. Only a few fields are read.
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema: { type: string }
          description: |
            HMAC-SHA256 of the raw body. The SHA-1 header GitHub also sends is
            deliberately ignored; honouring it would allow a downgrade to a
            broken hash.
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema: { type: string }
        - name: X-GitHub-Event
          in: header
          required: true
          schema: { type: string }
      responses:
        "204":
          description: |
            Applied, or deduplicated because it already was. Events naming an
            unknown installation and unrecognised event types also land here:
            both are deliberate no-ops, and failing them would make GitHub
            retry forever.
        "400":
          description: The delivery was unreadable or lacked required headers.
        "401":
          description: The signature was absent, malformed, or did not match.
        "409":
          description: |
            Another attempt holds this delivery and has not finished.
            Deliberately not acknowledged: GitHub does not retry what it
            believes succeeded, so answering 2xx here would discard the
            delivery if that attempt then failed.
        "500":
          description: |
            Applying the delivery failed. GitHub retries, and the retry is
            processed rather than deduplicated away.

components:
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InstallationId:
      name: installationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A session token issued by the configured identity provider, presented
        as `Authorization: Bearer <token>`.

  schemas:
    Task:
      type: object
      required: [id, title, body, status, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        body:
          type: string
          maxLength: 50000
          description: |
            Untrusted input, returned byte-identical to what was stored.
        repository_id:
          type: string
          format: uuid
          description: |
            What the task runs against. Absent while a draft, required at
            `ready` — a task that cannot name a repository cannot become a
            session, and the database enforces that rather than the handler.
        status: { $ref: "#/components/schemas/TaskStatus" }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TaskInput:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 50000 }
        repository_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/TaskStatus" }

    TaskPatch:
      type: object
      description: |
        Every field is optional and omitting one leaves it unchanged. This is
        deliberately not TaskInput: a schema requiring a title on a PATCH
        invites a caller to send only the title, and anything treating the
        remainder as empty would destroy a body nobody asked it to touch.
      properties:
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 50000 }
        repository_id: { type: string, format: uuid, nullable: true }
        status: { $ref: "#/components/schemas/TaskStatus" }

    TaskStatus:
      type: string
      enum: [draft, ready, archived]
      description: |
        A closed set. A status nothing recognises is a task that silently
        never runs.

    Agent:
      type: object
      required: [id, name, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
        current_version_id:
          type: string
          format: uuid
          description: |
            The settings in use. A session is pinned to this rather than to the
            agent, so that editing the profile later cannot rewrite what the
            session ran under.
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AgentVersion:
      type: object
      required:
        [id, agent_id, version, provider, model, capabilities, tool_policy, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        version: { type: integer }
        provider: { $ref: "#/components/schemas/Provider" }
        model: { type: string, maxLength: 200 }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }
          description: |
            What this provider supports. The interface derives its controls
            from this rather than assuming — no feature may assume every
            provider offers pause, structured tool calls or token accounting.
        tool_policy:
          type: object
          # Open, and it has to be said explicitly: `type: object` with no
          # properties and no additionalProperties generates
          # `Record<string, never>`, a type permitting no keys at all — so the
          # browser could neither send nor read a policy while the column
          # holds arbitrary jsonb. The object is opaque, not empty.
          additionalProperties: true
          description: |
            What the agent is allowed to do. Opaque until M7, and versioned
            because it is a security control: a session must be readable
            against the policy it actually ran under.
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    AgentVersionInput:
      type: object
      required: [provider, model]
      properties:
        provider: { $ref: "#/components/schemas/Provider" }
        model: { type: string, maxLength: 200 }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }
        tool_policy: { type: object, additionalProperties: true }

    Session:
      type: object
      required:
        [
          id,
          task_id,
          agent_version_id,
          state,
          version,
          repository_id,
          branch_name,
          next_states,
          created_by,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        agent_version_id:
          type: string
          format: uuid
          description: |
            The pinned settings. A session references a version rather than an
            agent because a version cannot be edited, so the pin is also the
            policy snapshot — reading it back says exactly what this session
            runs under, however the profile has since changed.
        state: { $ref: "#/components/schemas/SessionState" }
        version:
          type: integer
          description: |
            Optimistic concurrency. A state change states the version it
            observed and is refused if the session has moved since.
        repository_id: { type: string, format: uuid }
        branch_name:
          type: string
          description: |
            The branch the workflow will create. **It does not exist yet.** The
            name is derived from the session id rather than generated, so an
            activity that retries finds the branch it already made instead of
            cutting a second one.
        base_branch:
          type: string
          description: |
            Empty means the repository's default branch, resolved when the
            branch is cut rather than now — the default can change in between,
            and the workflow is the thing holding a GitHub token.
        continues_id:
          type: string
          format: uuid
          description: |
            The terminal session this one continues. Terminal history is
            immutable, so reopening creates a linked session rather than
            reviving the old one.
        next_states:
          type: array
          items: { $ref: "#/components/schemas/SessionState" }
          description: |
            The states this session may move to, from the transition table the
            server holds. Served rather than reimplemented in the browser: two
            copies of a rule disagree eventually.
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SessionInput:
      type: object
      required: [task_id, agent_version_id]
      properties:
        task_id: { type: string, format: uuid }
        agent_version_id: { type: string, format: uuid }
        base_branch:
          type: string
          maxLength: 200
          description: Omit for the repository's default branch.

    SessionState:
      type: string
      enum:
        [
          draft,
          queued,
          provisioning,
          running,
          waiting_for_input,
          waiting_for_approval,
          pausing,
          paused,
          resuming,
          review_ready,
          finalizing,
          completed,
          cancelling,
          cancelled,
          failed,
          expired,
        ]
      description: |
        The sixteen states in `context/architecture.md`. `completed`,
        `cancelled`, `failed` and `expired` are terminal and have no outgoing
        transitions at all.

    SessionTransition:
      type: object
      required: [id, next_state, observed_version, created_at]
      properties:
        id: { type: string, format: uuid }
        previous_state:
          allOf: [{ $ref: "#/components/schemas/SessionState" }]
          description: |
            Absent on the first transition. A session comes into existence
            already in a state, so recording a move it never made would be a
            fiction in a trail that cannot be edited.
        next_state: { $ref: "#/components/schemas/SessionState" }
        observed_version: { type: integer }
        reason: { type: string }
        actor_user_id:
          type: string
          format: uuid
          description: |
            Absent when the system moved the session. A timeout is not
            attributable to a person, and naming one would be a false statement.
        created_at: { type: string, format: date-time }

    SessionParticipant:
      type: object
      required: [user_id, capacity, created_at]
      properties:
        user_id: { type: string, format: uuid }
        capacity:
          type: string
          enum: [owner, collaborator, observer]
          description: |
            What someone is doing in this session, which is not the same as
            what they may do in the workspace — those are the membership roles.
        created_at: { type: string, format: date-time }

    Provider:
      type: string
      enum: [claude_code, codex, fake]
      description: |
        `fake` is a first-class provider, not a placeholder: a deterministic
        adapter verifies orchestration, events and approvals before a paid
        provider is wired in.

    Capability:
      type: string
      enum: [pause, resume, cancel, send_instruction, structured_tool_calls, token_accounting]
      description: |
        A closed set, named after the adapter contract. Free text would make an
        unrecognised capability a typo that silently disables a feature rather
        than a rejected write.

    Branch:
      type: object
      required: [name, sha, base, created]
      properties:
        name: { type: string }
        sha:
          type: string
          description: The commit the branch points at.
        base: { type: string }
        created:
          type: boolean
          description: |
            False when the branch already existed at the requested base.
            Reported rather than hidden: the caller has a branch at the commit
            they asked for either way, but "already there" and "just made" are
            different facts.

    Installation:
      type: object
      required: [id, account_login, account_type, repository_selection, suspended, created_at]
      properties:
        id: { type: string, format: uuid }
        account_login: { type: string }
        account_type: { type: string, enum: [User, Organization] }
        repository_selection:
          type: string
          enum: [all, selected]
          description: |
            `all` grants repositories created later too, with no event naming
            them — one reason access is reconciled before use.
        suspended: { type: boolean }
        suspended_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    Repository:
      type: object
      required: [id, installation_id, owner, name, full_name, default_branch, private, granted]
      properties:
        id: { type: string, format: uuid }
        installation_id:
          type: string
          format: uuid
          description: |
            Which connected account this came from. A workspace may have
            several, and presenting them as one flat list hides which
            connection is failing when one of them is.
        owner: { type: string }
        name: { type: string }
        full_name: { type: string }
        default_branch: { type: string }
        private: { type: boolean }
        granted:
          type: boolean
          description: |
            False for a repository the installation no longer reaches.
            Reported rather than filtered out.

    InstallationHealth:
      type: object
      required:
        [
          installation_id,
          account_login,
          reachable,
          suspended,
          missing_permissions,
          granted_repositories,
        ]
      properties:
        installation_id: { type: string, format: uuid }
        account_login: { type: string }
        reachable:
          type: boolean
          description: False when GitHub could not be reached; the rest is then last-known.
        suspended: { type: boolean }
        missing_permissions:
          type: array
          items: { type: string }
          description: |
            Named as `permission:access`, because the only useful thing to tell
            someone whose workspace stopped working is which permission to
            approve.
        granted_repositories: { type: integer }
        error: { type: string }

    Role:
      type: string
      description: |
        A member's position in a workspace. Permissions are derived from the
        role by the server; clients read `permissions` rather than mapping
        roles themselves.
      enum: [owner, admin, developer, viewer]

    Permission:
      type: string
      description: An action a member may perform, named for the action rather than the role.
      enum:
        - workspace:read
        - workspace:manage
        - member:invite
        - member:manage
        - session:create
        - session:control
        - action:approve
        - repository:manage
        - billing:manage

    Workspace:
      type: object
      additionalProperties: false
      required: [id, slug, name, version, role, created_at, permissions]
      properties:
        id: { type: string, format: uuid }
        slug:
          type: string
          description: URL-safe identifier, derived from the name and unique across workspaces.
        name: { type: string }
        version:
          type: integer
          description: |
            Optimistic concurrency token. Send it back on the next update; a
            stale value is rejected with `409` instead of overwriting.
        role: { $ref: "#/components/schemas/Role" }
        permissions:
          type: array
          description: |
            What the caller may do here. Advisory, for hiding controls the
            caller cannot use — the server enforces the same matrix regardless.
          items: { $ref: "#/components/schemas/Permission" }
        created_at: { type: string, format: date-time }

    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, role, status, expires_at, created_at]
      description: An offer to join a workspace. Never carries the token or its hash.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        status:
          type: string
          description: |
            Derived from the invitation's timestamps rather than stored, so it
            cannot disagree with them. A terminal state wins over expiry: an
            invitation accepted while still valid reads as `accepted`.
          enum: [pending, accepted, revoked, expired]
        invited_by_email: { type: string, format: email }
        invited_by_display_name: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    IssuedInvitation:
      allOf:
        - $ref: "#/components/schemas/Invitation"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: |
                **Shown once.** Only a SHA-256 hash is stored, so this value
                cannot be recovered afterwards — not by this API, and not by
                anyone with database access. Put it in the invitation link
                immediately.

    InvitationTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string }

    InvitationPreview:
      type: object
      additionalProperties: false
      required: [workspace_name, role, invited_by_email, expires_at]
      description: |
        Deliberately narrow. It tells the holder what they are joining and who
        asked, and reveals nothing else about the workspace or its members.

        In particular it does **not** include the invited address. A token can
        be forwarded, and whoever ends up holding it should not learn who it
        was meant for.
      properties:
        workspace_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        invited_by_email: { type: string, format: email }
        invited_by_display_name: { type: string }
        expires_at: { type: string, format: date-time }

    Member:
      type: object
      additionalProperties: false
      required: [user_id, email, role]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        avatar_url: { type: string, format: uri }
        role: { $ref: "#/components/schemas/Role" }

    User:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
          description: The user's Weave identifier. Stable, and the only user identifier the API accepts or returns.
          examples: ["0199a3b4-1c2d-7e3f-8a9b-0c1d2e3f4a5b"]
        email:
          type: string
          format: email
          examples: ["developer@example.com"]
        display_name:
          type: string
          description: Omitted when the identity provider supplied no name.
          examples: ["Ada Lovelace"]
        avatar_url:
          type: string
          format: uri
          description: Omitted when the identity provider supplied no avatar.

    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      description: |
        The error shape returned by every failing endpoint.

        It never contains a stack trace, database error, provider response or
        internal hostname. Quote `request_id` when reporting a problem: it
        correlates to the server-side logs that hold the diagnosis.
      properties:
        code:
          type: string
          description: Stable, machine-readable identifier. Clients branch on this rather than on `message`.
          enum:
            - unauthenticated
            - permission_denied
            - not_found
            - conflict
            - invalid_request
            - internal_error
        message:
          type: string
          description: Human-readable summary, safe to surface to an end user.
        request_id:
          type: string
          description: Correlates this response with server-side logs. Also returned in the `X-Request-Id` header.

  responses:
    Unauthenticated:
      description: |
        No valid credential was presented.

        Returned identically whether the token was absent, malformed, expired,
        signed by the wrong key, or issued for a different audience.
        Distinguishing them would tell a caller how close a forgery attempt
        came, and no legitimate client needs the difference.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthenticated
            message: Authentication required. Present a valid bearer token.
            request_id: 0199a3b4-1c2d-7e3f-8a9b-0c1d2e3f4a5b

    WorkspaceNotFound:
      description: |
        No such workspace, **or** the caller is not a member of it. The two are
        deliberately indistinguishable: answering `403` for a workspace that
        exists but is not the caller's would let anyone enumerate tenants by
        guessing identifiers.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    PermissionDenied:
      description: |
        The caller is a member of this workspace but their role does not hold
        the required permission. Distinct from `404`, which hides the workspace
        entirely.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    Conflict:
      description: |
        The request conflicts with the resource's current state — a stale
        `version`, or a change that would leave the workspace with no owner.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    InvitationNotUsable:
      description: |
        The invitation cannot be used.

        Returned identically whether the token is unknown, expired, revoked or
        already accepted. Distinguishing them would tell someone guessing
        tokens which guesses were once real, turning a brute-force attempt
        into a search with feedback.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    InvalidRequest:
      description: The body was malformed, carried unknown fields, or failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    InternalError:
      description: The request could not be completed. The failure is recorded against `request_id`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unavailable:
      description: |
        A dependency the request needs is temporarily unreachable — for
        example the identity provider's signing keys. The credential may be
        perfectly valid; it could not be checked. Safe to retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
